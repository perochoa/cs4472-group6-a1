name: CI

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [dev, test/gh-actions]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Checkstyle
        run: mvn -B checkstyle:check

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      # Decide how strictly to run the suite before doing any work.
      - name: Determine phase from PR labels
        id: phase
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push to dev: running the suite in informational mode."
            echo "mode=informational" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          phases=$(echo "$LABELS" | jq -r '.[] | select(. == "phase:tests" or . == "phase:fix")')
          count=$(printf '%s' "$phases" | grep -c . || true)

          if [ "$count" -ne 1 ]; then
            echo "::error title=Missing phase label::PR must carry exactly one of 'phase:tests' or 'phase:fix' (found: ${phases:-none})."
            exit 1
          fi

          echo "PR phase: $phases"
          echo "mode=${phases#phase:}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      # Checkstyle is bound to the validate phase in pom.xml; the lint job owns it.
      - name: Run tests (failures tolerated)
        if: steps.phase.outputs.mode != 'fix'
        run: mvn -B -Dcheckstyle.skip=true -Dmaven.test.failure.ignore=true test

      - name: Run tests (entire suite must pass)
        if: steps.phase.outputs.mode == 'fix'
        run: mvn -B -Dcheckstyle.skip=true test

      - name: Publish JUnit results
        if: always() && steps.phase.outcome == 'success'
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: JUnit test report
          report_paths: target/surefire-reports/TEST-*.xml
          detailed_summary: true
          include_passed: true
          comment: ${{ github.event_name == 'pull_request' }}
          updateComment: true
          fail_on_failure: false
          require_tests: false

      - name: Publish JaCoCo coverage
        if: always() && github.event_name == 'pull_request' && hashFiles('target/site/jacoco/jacoco.xml') != ''
        continue-on-error: true
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Coverage report
          update-comment: true

      - name: Upload coverage HTML
        if: always() && hashFiles('target/site/jacoco/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
